name: py-bench

on:
  pull_request:
    paths:
      - "src/langsmith/**"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: files
        name: Get changed files
        uses: Ana06/get-changed-files@25f79e676e7ea1868813e21465014798211fad8c # v2.3.0
        with:
          format: json

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.10.2'
          python-version: 3.11
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Download baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          key: ${{ runner.os }}-benchmark-baseline
          restore-keys: |
            ${{ runner.os }}-benchmark-baseline-
          fail-on-cache-miss: true
          path: out/benchmark-baseline.json

      - name: Run benchmarks
        id: benchmark
        run: |
          mkdir -p out
          {
            echo 'OUTPUT<<EOF'
            uv run python -m bench -o out/benchmark.json --fast
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Compare benchmarks
        id: compare
        run: |
          {
            echo 'OUTPUT<<EOF'
            mv out/benchmark-baseline.json out/main.json
            mv out/benchmark.json out/changes.json
            uv run pyperf compare_to out/main.json out/changes.json --table --group-by-speed
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Annotation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const file = JSON.parse(`${{ steps.files.outputs.added_modified_renamed }}`)[0]
            core.notice(`${{ steps.benchmark.outputs.OUTPUT }}`, { title: 'Benchmark results', file })
            core.notice(`${{ steps.compare.outputs.OUTPUT }}`, { title: 'Comparison against main', file })
