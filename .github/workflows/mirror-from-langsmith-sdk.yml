name: Mirror from langsmith-sdk

# Hourly: take the next langsmith-sdk main commit after .mirror-source-sha that touches
# python/, rewrite it with .github/scripts/mirror-from-langsmith-sdk.sh and open a PR that
# also bumps the pointer. Strictly one PR at a time: the next commit is picked only after
# the previous mirror PR merged. Skipped: langtions-bot commits, release(...) commits.
# An open mirror PR is never touched; to redo one, close it and delete its branch.
# To skip a commit for good, bump .mirror-source-sha by hand in a PR. Linear: LIN-504.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mirror-from-langsmith-sdk
  cancel-in-progress: false

env:
  LANG_KEY: python
  SOURCE_PATH: python
  SOURCE_REPO: langchain-ai/langsmith-sdk

jobs:
  mirror:
    if: github.repository == 'langchain-ai/langsmith-python-staging'
    runs-on: self-hosted-ubuntu-small-amd64
    steps:
      - name: Load GitHub App key from 1Password
        id: load-gh-app-secrets
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 # v4.0.1
        with:
          export-env: false
        env:
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN_INTERNAL }}
          OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
          LANGCHAINPLUS_GITHUB_APP_PRIVATE_KEY: op://${{ secrets.INTERNAL_INFRA_OP_VAULT }}/langchain-actions-pr-bot/private_key

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: "Iv23liMFOFBcPTKFWi3S"
          private-key: ${{ steps.load-gh-app-secrets.outputs.LANGCHAINPLUS_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out staging
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Clone langsmith-sdk
        run: git clone --quiet "https://github.com/$SOURCE_REPO.git" ../langsmith-sdk

      - name: Find the next commit to mirror
        id: pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          staging=$PWD; out=$RUNNER_TEMP/mirror
          pointer=$(cat .mirror-source-sha)
          cd ../langsmith-sdk
          for sha in $(git log --reverse --format=%H "$pointer..origin/main" -- "$SOURCE_PATH"); do
            author=$(git log -1 --format=%an "$sha"); subject=$(git log -1 --format=%s "$sha")
            [ "$author" = "langtions-bot[bot]" ] && continue
            case "$subject" in release\(*) continue ;; esac
            rm -rf "$out"
            "$staging/.github/scripts/mirror-from-langsmith-sdk.sh" "$LANG_KEY" "$sha" "$staging" "$out"
            status=$(cat "$out/status")
            [ "$status" = noop ] && continue
            branch="mirror/langsmith-sdk-$sha"
            if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')" ]; then
              echo "mirror PR for $sha is open, waiting for it"; exit 0
            fi
            echo "picked $sha: $subject ($status)"
            {
              echo "sha=$sha"; echo "status=$status"; echo "branch=$branch"; echo "out=$out"
              echo "subject=$subject"; echo "author=$(git log -1 --format='%an <%ae>' "$sha")"
              echo "pr=$(printf '%s' "$subject" | grep -oE '\(#[0-9]+\)$' | tr -dc 0-9)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "up to date with $SOURCE_REPO"

      - name: Keep the rewritten patch for failed hunks
        if: steps.pick.outputs.status == 'conflict'
        uses: actions/upload-artifact@v6
        with:
          name: mirror-${{ steps.pick.outputs.sha }}
          path: ${{ steps.pick.outputs.out }}

      - name: Commit and push the mirror branch
        if: steps.pick.outputs.sha != ''
        env:
          SHA: ${{ steps.pick.outputs.sha }}
          SUBJECT: ${{ steps.pick.outputs.subject }}
          AUTHOR: ${{ steps.pick.outputs.author }}
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          echo "$SHA" > .mirror-source-sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --author="$AUTHOR" -m "$SUBJECT" -m "Mirrored from $SOURCE_REPO@$SHA"
          git push --force origin "HEAD:refs/heads/$BRANCH"

      - name: Open the PR
        id: pr
        if: steps.pick.outputs.sha != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ steps.pick.outputs.sha }}
          SUBJECT: ${{ steps.pick.outputs.subject }}
          BRANCH: ${{ steps.pick.outputs.branch }}
          SOURCE_PR: ${{ steps.pick.outputs.pr }}
          STATUS: ${{ steps.pick.outputs.status }}
          OUT: ${{ steps.pick.outputs.out }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Mirror of $SOURCE_REPO@$SHA${SOURCE_PR:+ ($SOURCE_REPO#$SOURCE_PR)}. Bumps \`.mirror-source-sha\`."
            echo
            if [ "$STATUS" = conflict ]; then
              echo "**Needs manual merge**: some hunks conflicted or did not apply. The rewritten patch is in the [workflow run]($RUN_URL) artifacts. Resolve on this branch; the cron never touches an open mirror PR."
              echo
            fi
            cat "$OUT/summary.md"
          } > "$OUT/body.md"
          gh label create mirror --repo "$GITHUB_REPOSITORY" --color 0075ca --description "Mirrored from langsmith-sdk" --force
          gh label create needs-manual-merge --repo "$GITHUB_REPOSITORY" --color d93f0b --description "Mirrored patch conflicted; resolve by hand" --force
          labels=mirror; [ "$STATUS" = conflict ] && labels=mirror,needs-manual-merge
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$SUBJECT" --body-file "$OUT/body.md" --label "$labels"
          gh pr edit "$BRANCH" --repo "$GITHUB_REPOSITORY" --add-reviewer thibautlehmann,KiewanVillatel
          echo "url=$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: steps.pick.outputs.sha != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.INGESTION_CI_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ toJSON(secrets.INGESTION_TEAM_SLACK_CHANNEL_ID) }}
            text: |
              <@U0BSQM2BQJ3> mirror PR from langsmith-sdk${{ steps.pick.outputs.status == 'conflict' && ', *needs manual merge*' || '' }}: ${{ steps.pr.outputs.url }}
              ${{ steps.pick.outputs.subject }}
